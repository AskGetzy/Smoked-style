name: Nightly DB Backup

on:
  schedule:
    # 2:00 AM UTC every night
    - cron: '0 2 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install postgresql-client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          FILENAME="smoked-style-$(date -u +%Y-%m-%d).sql.gz"
          pg_dump "$DATABASE_URL" \
            --no-password \
            --format=plain \
            --no-owner \
            --no-acl \
            | gzip > "$FILENAME"
          echo "BACKUP_FILE=$FILENAME" >> "$GITHUB_ENV"
          echo "Backup written: $FILENAME ($(du -sh $FILENAME | cut -f1))"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        run: |
          echo "### DB Backup Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "File: \`$BACKUP_FILE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Size: $(du -sh $BACKUP_FILE | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "Retained for: 30 days" >> "$GITHUB_STEP_SUMMARY"
